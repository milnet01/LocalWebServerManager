# LWSM-1021. Builds the AppImage for a published release and attaches it.
#
# Deliberately thin, like ci.yml: scripts/build-appimage.sh is the whole
# recipe, smoke test included, so a release builds here exactly as it builds
# on a developer's machine. This file prepares a machine, calls it, and
# uploads what it made.
name: Release

on:
  release:
    types: [published]
  # Run by hand to prove the build on GitHub's runner without publishing:
  # it builds and smoke-tests, then skips the upload.
  workflow_dispatch:

permissions:
  contents: read

# One run per release at a time, so two runs cannot both --clobber the same
# asset. A queued run waits rather than cancelling the one uploading.
concurrency:
  group: release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  # LWSM-1550. Two jobs, so write permission is held only by the attach job:
  # the build (checkout, setup-uv and the whole recipe) runs with read
  # access, and the attach job, which runs nothing from the repository, is
  # the only one that can change the release.
  build:
    # Pinned rather than -latest, as in ci.yml.
    runs-on: ubuntu-24.04
    # The build and both smoke launches take minutes, not an hour.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # SHA-pinned with the release in a trailing comment, as in ci.yml. The
      # release event checks out the release's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build exports the locked dependencies with uv, so it is the same uv
      # the gate uses; tests/test_ci_contract.py holds both to ci-tools.env.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Build and smoke-test the AppImage
        run: ./scripts/build-appimage.sh

      # Hands the AppImage to the attach job. A run by hand stops here.
      - name: Keep the AppImage for the attach job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/LocalWebServerManager-*-x86_64.AppImage
          if-no-files-found: error
          # A re-run of every job uploads again under the same name. A week, so
          # a re-run of the attach job alone still finds the artifact; `.sig`
          # must be re-signed after either (docs/claude/release.md).
          overwrite: true
          retention-days: 7

  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # To attach the AppImage to the release.
      contents: write
    steps:
      - name: Fetch the AppImage the build job made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: dist

      # The file name carries pyproject.toml's version, so a tag that disagrees
      # with it names a file that does not exist, and the upload fails. There
      # is no checkout here, so GH_REPO tells gh which repository to change.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --clobber "$TAG" \
            "dist/LocalWebServerManager-${TAG#v}-x86_64.AppImage"
