# CI. Deliberately thin: it prepares a machine, then hands over to
# scripts/local-ci.sh, which owns every actual check.
#
# Do NOT add check steps here. A step added to this file and not to the script
# is a check the developer cannot run before pushing, which defeats the point
# of having a local gate at all. Change scripts/local-ci.sh instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the older run irrelevant on a PR, where
# only the head commit is ever merged; cancelling it keeps queue time (and, on
# private repos, minutes) down.
#
# NOT on a push to main, though. This project pushes straight to main, so two
# pushes in quick succession would cancel the first commit's run and leave it
# permanently ungated — nothing ever comes back to it (OWASP CICD-SEC-01,
# insufficient flow control).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    # Pinned rather than ubuntu-latest so a runner-image roll cannot turn a
    # green build red without a commit explaining it.
    runs-on: ubuntu-24.04
    # The tests bind real sockets and spawn real children (testing.md § T2/T3),
    # so a hang is a plausible failure rather than a hypothetical one. The
    # default is 360 minutes; the whole gate runs in well under one.
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not a tag: a major tag is a moving reference,
      # and these two lines are the only third-party CODE that runs in this
      # job. dependabot updates SHA pins and rewrites the trailing comment.
      # persist-credentials: nothing here pushes, so leaving the job token in
      # .git/config for the rest of the run buys nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comment is TRAILING, like checkout's above: dependabot
      # rewrites that form when it bumps the SHA. On its own line it would go on
      # asserting a version the pin no longer points at.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned, because an unpinned setup-uv resolves whatever uv is latest
          # at run time — a floating reference of the kind
          # dependencies.md § 6 forbids, and it made "the local run matches
          # GitHub exactly" false without saying so. The two sides move together
          # in one commit or not at all, since the resolver writes uv.lock.
          #
          # 0.12.2 since 2026-08-06 (LWSM-1083 / LWSM-1064). The previous pin,
          # 0.11.7, is affected by GHSA-4gg8-gxpx-9rph: uv does not validate
          # entry-point names, so a malicious wheel's console_scripts can place
          # an executable outside the intended environment. Fixed in 0.11.15,
          # no workaround. Re-locking under 0.12.2 left uv.lock byte-identical.
          version: "0.12.2"
          enable-cache: true

      # Reads .python-version, which is committed so that this machine and a
      # developer's resolve the SAME interpreter. requires-python is only a
      # floor (>=3.13), and with filterwarnings=["error"] in pyproject.toml a
      # single new-version DeprecationWarning is a red build that does not
      # reproduce locally.
      - name: Install Python
        run: uv python install

      # Qt needs these even to start offscreen; a bare runner has none of them
      # and PySide6 fails to import with a bare "libEGL.so.1: cannot open
      # shared object file".
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # Every version comes from scripts/ci-tools.env, which local-ci.sh reads
      # too — so this job and a developer's machine cannot install different
      # tools. That was not true until 2026-08-18: shellcheck and yamllint came
      # from apt here and from the distro there, the runner's shellcheck was
      # older, and it failed SC2015 on a file that was clean locally. Pinning
      # the STEPS was never enough; a gate is its tools.
      #
      # shellcheck comes from the project's own release tarball rather than
      # apt, because apt can only offer whatever the runner image pins and
      # docs/standards/dependencies.md § 2.1 forbids a floating reference.
      # yamllint goes through `uv tool`, which is already on the machine.
      #
      # tests/test_ci_contract.py asserts this step installs exactly the three
      # versions ci-tools.env names, so an edit to one side alone fails the
      # gate rather than reaching GitHub.
      - name: Install shellcheck, actionlint and yamllint
        run: |
          set -Eeuo pipefail
          . scripts/ci-tools.env
          dir="shellcheck-v${SHELLCHECK_VERSION}"
          base=https://github.com/koalaman/shellcheck/releases/download
          curl -fsSL --retry 3 \
            "$base/v${SHELLCHECK_VERSION}/$dir.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/$dir/shellcheck" /usr/local/bin/shellcheck
          uv tool install "yamllint==${YAMLLINT_VERSION}"
          actionlint=github.com/rhysd/actionlint/cmd/actionlint
          go install "$actionlint@v${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # LWSM_REQUIRE_ALL_TOOLS turns a SKIP into a failure HERE only. On a
      # developer's machine a missing linter must not stop them testing
      # their own change; on the machine that is supposed to hold every
      # tool, a green tick that cannot be told apart from a degraded run is
      # worse than a red one. The list of checks lives only in the script.
      - name: Run the gate
        env:
          LWSM_REQUIRE_ALL_TOOLS: 1
        run: ./scripts/local-ci.sh
