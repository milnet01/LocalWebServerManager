# CI. Deliberately thin: it prepares a machine, then hands over to
# scripts/local-ci.sh, which owns every actual check.
#
# Do NOT add check steps here. A step added to this file and not to the script
# is a check the developer cannot run before pushing, which defeats the point
# of having a local gate at all. Change scripts/local-ci.sh instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the older run irrelevant; cancelling it
# keeps queue time (and, on private repos, minutes) down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Pinned rather than ubuntu-latest so a runner-image roll cannot turn a
    # green build red without a commit explaining it.
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a commit SHA, not a tag: a major tag is a moving reference,
      # and these two lines are the only third-party CODE that runs in this
      # job. dependabot updates SHA pins and rewrites the trailing comment.
      # persist-credentials: nothing here pushes, so leaving the job token in
      # .git/config for the rest of the run buys nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      # Qt needs these even to start offscreen; a bare runner has none of them
      # and PySide6 fails to import with a bare "libEGL.so.1: cannot open
      # shared object file".
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # actionlint is pinned, not @latest: docs/standards/dependencies.md § 2.1
      # forbids a floating reference, and a linter that silently changes
      # version can turn a green build red with no commit explaining it.
      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run the gate
        run: ./scripts/local-ci.sh
