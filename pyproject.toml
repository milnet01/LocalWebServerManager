[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "localwebservermanager"
version = "0.5.1"
description = "Find, start, stop and watch the local web servers your projects run."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Anthony Schemel" }]

# Runtime dependencies, pinned exactly. Three, each earning its weight in the
# self-contained AppImage (LWSM-1021): the whole app is a Qt window over the
# socket table, plus the signature check its self-update rests on (LWSM-1548).
dependencies = [
    # The GUI. ADR-0003 exists BECAUSE this binding does not expose
    # QProcess.setChildProcessModifier, so the version is load-bearing rather
    # than incidental: re-verify that `hasattr` on every bump, because the day
    # it returns True is the day ADR-0003 could be revisited.
    # 6.12.0 is current (PyPI, 2026-10-08) and was checked — still absent.
    # Essentials, not the PySide6 meta-package (LWSM-1397): src/ uses only
    # QtCore, QtGui, QtWidgets and QtNetwork, all in Essentials. The
    # meta-package adds Addons, WebEngine and Pdf, which nothing here imports.
    "PySide6-Essentials==6.12.0",
    # Port ownership and process trees: "what holds port N", "which ports does
    # this process group hold", and the descendant walk the foreign-stop path
    # needs (ADR-0004). The alternative was parsing `ss -tlnp`, rejected as
    # fragile in docs/discovery.md § Tech stack.
    "psutil==7.2.2",
    # Checks the Ed25519 signature on a downloaded update (LWSM-1548). A
    # hand-written verifier was rejected: a subtle mistake there accepts a fake
    # update. scripts/_appimage-build.sh fails a bundle missing its binding.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    # Drives Qt widgets and signals in tests, and supplies qtbot.waitUntil —
    # which docs/standards/testing-overrides.md § T4 requires INSTEAD of sleeping for a
    # duration, the flakiness shape this codebase is most exposed to.
    # 4.5.0 is the current release; verified against PyPI, not recalled.
    "pytest-qt==4.5.0",
    # LWSM-1374. Shuffles test order and reseeds per test on every run, so a
    # test that depends on another's leftovers fails (shared testing.md § 7).
    # A failing order reproduces with `--randomly-seed=N`, N being the seed the
    # run prints (or `last`); disabling it with `-p no:randomly` is a smell.
    "pytest-randomly==5.1.0",
    # LWSM-1329. Runs the suite on several processes; scripts/local-ci.sh
    # sets how many.
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
    # LWSM-1066. The `nodejs` extra pins the Node runtime pyright needs through
    # uv.lock, instead of whatever Node a machine happens to have.
    "pyright[nodejs]==1.1.414",
]
# LWSM-1021. Freezes the app into the folder the AppImage wraps. Only
# scripts/build-appimage.sh installs it, inside its build container, from the
# hashes in uv.lock; the gate never does.
package = [
    "pyinstaller==6.22.3",
]

[project.scripts]
lwsm = "lwsm.__main__:run"

[project.urls]
Homepage = "https://github.com/milnet01/LocalWebServerManager"
Issues = "https://github.com/milnet01/LocalWebServerManager/issues"

[tool.uv]
# The build backend is a dependency that RUNS CODE, and it sits outside
# uv.lock — verified 2026-08-03: 15 packages locked, setuptools not among
# them. Without this constraint every `uv sync` resolves a floating,
# unhashed setuptools and executes it, on dev machines and CI alike. It is
# the one dependency the pin/lock/--locked/dependabot apparatus misses while
# appearing to cover it.
build-constraint-dependencies = ["setuptools==84.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

# typos runs in no gate; check-code reads this. Each entry is a deliberate
# spelling, named narrowly so a real slip of the same letters still shows.
[tool.typos.default]
extend-ignore-re = [
  '\b[0-9a-f]{7,40}\b',     # git short hashes ("3998ba6", "abd97c4")
  '(--|`)versoin',            # the misspelt flag tests/test_main.py feeds in
  'caf(\\xe9|\x{FFFD})',     # invalid-UTF-8 test data in tests/test_logbuffer.py
  'POSIX BRE',                # basic regular expression
]

[tool.typos.default.extend-words]
unparseable = "unparseable"
unparented = "unparented"
certifi = "certifi"     # the Python CA-bundle package
raison = "raison"       # French: a translation test's placeholder
mis = "mis"             # the prefix in "mis-detection", "mis-parse"
criticals = "criticals" # CRITICAL findings, as a noun

[tool.typos.default.extend-identifiers]
THM = "THM"  # a mermaid node id in docs/design.md
# Possessives in test names, which cannot hold an apostrophe.
test_the_port_types_are_the_registrys = "test_the_port_types_are_the_registrys"
test_a_crashed_copys_socket_is_recovered = "test_a_crashed_copys_socket_is_recovered"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade (current idioms per
# ~/.claude/standards/coding.md § 1.5), B flake8-bugbear, RUF100 unused-noqa.
# S (flake8-bandit) is enabled because this app spawns processes and signals
# process groups for a living: S603/S607 are exactly the rules that would catch
# a shell=True or an unvetted argv creeping into Supervisor, which coding-overrides.md
# § O4 forbids outright.
# RUF021 (and/or chained without parentheses) is the half of a precedence bug a
# tool can decide (LWSM-1285). The other half, `a or b if c else d`, which is
# the shape LWSM-1261 shipped inside the trust gate, has no ruff rule.
select = ["E", "W", "F", "I", "UP", "B", "RUF021", "RUF100", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests spawn real child processes on purpose (testing-overrides.md § T2) and assert on
# them, so the subprocess rules would fire on every fixture. The production
# rule is unaffected — this exemption is scoped to tests/ only.
"tests/**" = ["S101", "S603", "S607"]

[tool.pyright]
# LWSM-1066, the user's decision (2026-09-28): src/ only, at pyright's
# standard level. tests/ is out on purpose: it held about 190 of the 233
# errors measured that day, nearly all Qt test doubles, and typing them buys
# nothing the suite does not already check by running.
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gui: needs a Qt application object; runs headless under QT_QPA_PLATFORM=offscreen (testing-overrides.md § T6)",
    "integration: spawns real child processes or binds real sockets (testing-overrides.md § T2, T3)",
]
# Warnings are failures. This project is small enough that the alternative —
# a warning nobody reads until it becomes a break — has no upside.
filterwarnings = ["error"]
